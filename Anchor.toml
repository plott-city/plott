[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
poyz = "9hefehGRVBDE2A9kby8oQnRvEF5yK42px2ssfsQjchzU"

[registry]
url = "https://api.apr.dev"

[provider]
# localnet only. Never set this to devnet or mainnet: no chain transaction is
# allowed until the user supplies a deploy keypair path, its pubkey and an
# explicit cluster approval. See README "Deployment".
cluster = "localnet"
# Localnet-only test payer, generated by `scripts/gen-test-fixtures.js` and
# gitignored. It is NOT a deploy wallet and must never be registered as one.
# Deliberately not the shared global wallet (~/.config/solana/id.json): several
# projects sharing one wallet makes them share an on-chain upgrade authority.
wallet = "keypair/localnet-test-payer.json"

[scripts]
# Compile with tsc, then run plain mocha on the emitted JavaScript.
#
# Not ts-mocha: Node 22 strips TypeScript types natively and claims the `.ts`
# file before ts-node's CommonJS hook ever sees it, so the suite silently ran
# as an ES module and every `require` in it blew up. Compiling first removes
# the ambiguity entirely, and it type-checks the tests against the generated
# IDL types in `target/types/poyz.ts` -- a wrong instruction or account name in
# a test now fails the build instead of failing at runtime as a confusing
# account-resolution error.
test = "npx tsc -p tsconfig.test.json && npx mocha -t 1000000 .test-build/tests/*.js"

[test]
startup_wait = 30000

[test.validator]
# Agave 3.0 rejects the unspecified address that Anchor otherwise passes
# (`--bind-address 0.0.0.0` -> panic `UnspecifiedIpAddr`). Loopback also keeps
# the test validator off every other interface on the machine.
bind_address = "127.0.0.1"

# Pyth PriceUpdateV2 fixtures, loaded into the local validator at genesis.
# Regenerated before every run by `scripts/gen-test-fixtures.js`, because
# `publish_time` is stamped relative to the run. They are owned by the Pyth
# receiver program, so no test transaction could create them; loading them at
# genesis is what lets the tests exercise the real oracle path in
# `src/oracle.rs` rather than a mock branch compiled into the program.
[[test.validator.account]]
address = "2XwzUW7588XpaYmGwmKird7hzUyhSkghtBB2YtTQ2fa6"
filename = "tests/fixtures/pyth_sol_usd_healthy.json"

[[test.validator.account]]
address = "HVVTmKdSCSQaLN1exh5vSSdz3KT8Nw3Keyjrvipsg9bh"
filename = "tests/fixtures/pyth_sol_usd_wide_conf.json"

[[test.validator.account]]
address = "9PYUZH5BoaMJnjbb4MS7zqoieNb8KFu7Mf59dh5sfYta"
filename = "tests/fixtures/pyth_sol_usd_partial.json"

[[test.validator.account]]
address = "B52pS61nN8kbmp4uJfMhVMFdab4bHZrqWuWbUvQuQJBE"
filename = "tests/fixtures/pyth_sol_usd_shifted.json"
